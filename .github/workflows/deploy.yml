name: Deploy Vite App to GitHub Pages

on:
  # Berjalan otomatis setiap ada push ke branch main
  push:
    branches: ["main"]
  # Memungkinkan Anda menjalankan workflow secara manual dari tab Actions
  workflow_dispatch:

# Mengatur izin token GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Memastikan hanya satu deploy yang berjalan pada satu waktu
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
